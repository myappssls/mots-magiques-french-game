# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line. Check Gradle settings in the IDE.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also
# http://developer.android.com/studio/releases/gradle-plugin/
# (Type 'gradlew properties' to see all available properties.)
# Constraints on the daemon process:
# Gradle will not auto-detect visual VC++ build tools
# if not explicitly set with GRADLE_LOCAL_C_COMPILER.
# For unit tests, use pool size of 1 in CI to avoid timeouts when many tests
# are running, or set JVM args to give more memory.
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=dumps

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it explicit. Enable to migrate existing projects.
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not include resources from the
# dependencies,unless the dependencies explicitly share their resources public API and
# the client explicitly consumes the shared resources.
android.nonTransitiveRClass=true

# Build properties
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.parallel=true
